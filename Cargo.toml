[workspace]
resolver = "2"
members = [
    "crates/dualidad-core",
    "crates/dualidad-engine3d",
    "crates/dualidad-app",
]
default-members = ["crates/dualidad-app"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Omar Palomares Velasco", "Leonardo Miguel Vega Carbajal"]
repository = "https://github.com/omarPVP123131/Dualidad-Onda-Fisica"

[workspace.lints.clippy]
all = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
