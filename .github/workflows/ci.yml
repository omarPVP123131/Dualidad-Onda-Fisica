name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Dependencias del sistema (macroquad en Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Humo de arranque (Xvfb, sin GPU)
        run: |
          sudo apt-get install -y xvfb libxkbcommon0
          timeout 8 xvfb-run -a ./target/release/dualidad || test $? -eq 124
