# COPIA DE REFERENCIA. La CI ACTIVA vive en .github/workflows/ci.yml
# (activada en v0.3). Este archivo queda solo como respaldo legible.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Dependencias del sistema (macroquad en Linux)
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - run: Cargo fmt --check
      - run: Cargo clippy --all-targets -- -D warnings
      - run: Cargo test
      - run: Cargo build --release
